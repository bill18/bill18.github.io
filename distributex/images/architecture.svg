<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Menlo,Consolas,monospace">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="30" font-size="18" font-weight="700" text-anchor="middle" fill="#222">DistributeX WSPP — System Architecture</text>

  <!-- ============ CLIENTS ============ -->
  <rect x="30" y="60" width="160" height="120" rx="8" fill="#ebf8ff" stroke="#3182ce" stroke-width="2"/>
  <text x="110" y="85" font-size="14" font-weight="700" text-anchor="middle" fill="#2b6cb0">Clients</text>
  <text x="110" y="105" font-size="11" text-anchor="middle" fill="#4a5568">C++ • Java • Python</text>
  <text x="110" y="120" font-size="11" text-anchor="middle" fill="#4a5568">C# • VBA</text>
  <text x="110" y="145" font-size="10" text-anchor="middle" fill="#718096">HTTP / WS / MQ</text>

  <!-- ============ TRANSPORT ADAPTERS ============ -->
  <rect x="250" y="40" width="200" height="160" rx="8" fill="#fefcbf" stroke="#d69e2e" stroke-width="2"/>
  <text x="350" y="60" font-size="14" font-weight="700" text-anchor="middle" fill="#975a16">Transport Adapters</text>
  <rect x="265" y="72" width="170" height="22" rx="4" fill="#fefcbf" stroke="#ecc94b" stroke-width="1"/>
  <text x="350" y="87" font-size="11" text-anchor="middle" fill="#744210">HttpPushPullModule</text>
  <rect x="265" y="98" width="170" height="22" rx="4" fill="#fefcbf" stroke="#ecc94b" stroke-width="1"/>
  <text x="350" y="113" font-size="11" text-anchor="middle" fill="#744210">SseModule</text>
  <rect x="265" y="124" width="170" height="22" rx="4" fill="#fefcbf" stroke="#ecc94b" stroke-width="1"/>
  <text x="350" y="139" font-size="11" text-anchor="middle" fill="#744210">MqClientGateway</text>
  <rect x="265" y="150" width="170" height="22" rx="4" fill="#fefcbf" stroke="#ecc94b" stroke-width="1"/>
  <text x="350" y="165" font-size="11" text-anchor="middle" fill="#744210">WSAdapter (WebSocket++)</text>
  <text x="350" y="190" font-size="10" text-anchor="middle" fill="#975a16">RequestEnvelope</text>

  <!-- arrow from clients to transports -->
  <line x1="190" y1="110" x2="250" y2="110" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ COMMON GATEWAY ============ -->
  <rect x="250" y="220" width="200" height="120" rx="8" fill="#fed7d7" stroke="#e53e3e" stroke-width="2"/>
  <text x="350" y="240" font-size="14" font-weight="700" text-anchor="middle" fill="#c53030">Common Gateway</text>
  <rect x="265" y="252" width="170" height="22" rx="4" fill="#fed7d7" stroke="#fc8181" stroke-width="1"/>
  <text x="350" y="267" font-size="11" text-anchor="middle" fill="#9b2c2c">AuthService</text>
  <rect x="265" y="278" width="170" height="22" rx="4" fill="#fed7d7" stroke="#fc8181" stroke-width="1"/>
  <text x="350" y="293" font-size="11" text-anchor="middle" fill="#9b2c2c">RequestSubmissionService</text>
  <rect x="265" y="304" width="170" height="22" rx="4" fill="#fed7d7" stroke="#fc8181" stroke-width="1"/>
  <text x="350" y="319" font-size="11" text-anchor="middle" fill="#9b2c2c">ResultCache</text>

  <!-- arrow from transports to gateway -->
  <line x1="350" y1="200" x2="350" y2="220" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ BROKER LAYER ============ -->
  <rect x="250" y="360" width="200" height="130" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="350" y="380" font-size="14" font-weight="700" text-anchor="middle" fill="#6b46c1">Unified Broker</text>
  <rect x="265" y="392" width="170" height="22" rx="4" fill="#e9d8fd" stroke="#b794f4" stroke-width="1"/>
  <text x="350" y="407" font-size="11" text-anchor="middle" fill="#553c9a">InMemoryBroker</text>
  <rect x="265" y="418" width="170" height="22" rx="4" fill="#e9d8fd" stroke="#b794f4" stroke-width="1"/>
  <text x="350" y="433" font-size="11" text-anchor="middle" fill="#553c9a">NATSBroker</text>
  <rect x="265" y="444" width="170" height="22" rx="4" fill="#e9d8fd" stroke="#b794f4" stroke-width="1"/>
  <text x="350" y="459" font-size="11" text-anchor="middle" fill="#553c9a">RedisBroker</text>
  <text x="350" y="482" font-size="10" text-anchor="middle" fill="#6b46c1">IBroker interface</text>

  <!-- arrow from gateway to broker -->
  <line x1="350" y1="340" x2="350" y2="360" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ RESULT ROUTER (side) ============ -->
  <rect x="470" y="260" width="160" height="50" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="2"/>
  <text x="550" y="280" font-size="12" font-weight="700" text-anchor="middle" fill="#c05621">ResultRouter</text>
  <text x="550" y="298" font-size="10" text-anchor="middle" fill="#9c4221">response topics</text>

  <line x1="430" y1="285" x2="470" y2="285" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="260" x2="550" y2="200" stroke="#555" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ============ WORKERS ============ -->
  <rect x="690" y="60" width="220" height="420" rx="8" fill="#e6fffa" stroke="#38a169" stroke-width="2"/>
  <text x="800" y="85" font-size="16" font-weight="700" text-anchor="middle" fill="#276749">Workers</text>

  <!-- C++ Worker -->
  <rect x="710" y="100" width="180" height="65" rx="6" fill="#e6fffa" stroke="#68d391" stroke-width="1"/>
  <text x="800" y="118" font-size="12" font-weight="700" text-anchor="middle" fill="#276749">C++ Worker</text>
  <text x="800" y="135" font-size="10" text-anchor="middle" fill="#4a5568">.so plugin loader</text>
  <text x="800" y="152" font-size="10" text-anchor="middle" fill="#4a5568">fork per task (isolation)</text>

  <!-- Java Worker -->
  <rect x="710" y="175" width="180" height="65" rx="6" fill="#e6fffa" stroke="#68d391" stroke-width="1"/>
  <text x="800" y="193" font-size="12" font-weight="700" text-anchor="middle" fill="#276749">Java Worker</text>
  <text x="800" y="210" font-size="10" text-anchor="middle" fill="#4a5568">.jar plugin loader</text>
  <text x="800" y="227" font-size="10" text-anchor="middle" fill="#4a5568">JNI bridge</text>

  <!-- Python Worker -->
  <rect x="710" y="250" width="180" height="65" rx="6" fill="#e6fffa" stroke="#68d391" stroke-width="1"/>
  <text x="800" y="268" font-size="12" font-weight="700" text-anchor="middle" fill="#276749">Python Worker</text>
  <text x="800" y="285" font-size="10" text-anchor="middle" fill="#4a5568">.py plugin loader</text>
  <text x="800" y="302" font-size="10" text-anchor="middle" fill="#4a5568">embedded interpreter</text>

  <!-- C# Worker -->
  <rect x="710" y="325" width="180" height="65" rx="6" fill="#e6fffa" stroke="#68d391" stroke-width="1"/>
  <text x="800" y="343" font-size="12" font-weight="700" text-anchor="middle" fill="#276749">C# Worker</text>
  <text x="800" y="360" font-size="10" text-anchor="middle" fill="#4a5568">.dll plugin loader</text>
  <text x="800" y="377" font-size="10" text-anchor="middle" fill="#4a5568">.NET Core host</text>

  <!-- VBA Worker -->
  <rect x="710" y="400" width="180" height="65" rx="6" fill="#e6fffa" stroke="#68d391" stroke-width="1"/>
  <text x="800" y="418" font-size="12" font-weight="700" text-anchor="middle" fill="#276749">VBA Worker</text>
  <text x="800" y="435" font-size="10" text-anchor="middle" fill="#4a5568">Excel macro bridge</text>
  <text x="800" y="452" font-size="10" text-anchor="middle" fill="#4a5568">COM interop</text>

  <!-- arrows from broker to workers -->
  <line x1="450" y1="405" x2="690" y2="150" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="425" x2="690" y2="400" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- legend -->
  <text x="30" y="510" font-size="11" fill="#718096">RequestEnvelope flow: Client → Transport → Gateway → Broker → Worker</text>
</svg>
