<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <rect fill="#ffffff" width="800" height="200"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13">
    <rect x="40" y="60" width="180" height="60" rx="6" fill="#eef" stroke="#336"/>
    <text x="130" y="90" text-anchor="middle" fill="#113">Client (WASM)</text>
    <text x="130" y="110" text-anchor="middle" fill="#335">Interactive pricing</text>

    <rect x="310" y="20" width="180" height="160" rx="6" fill="#efe" stroke="#363"/>
    <text x="400" y="60" text-anchor="middle" fill="#133">Gateway / gRPC</text>
    <text x="400" y="82" text-anchor="middle" fill="#355">Routing, auth, proxy</text>

    <rect x="580" y="60" width="180" height="60" rx="6" fill="#fee" stroke="#633"/>
    <text x="670" y="90" text-anchor="middle" fill="#311">Server (gRPC)</text>
    <text x="670" y="110" text-anchor="middle" fill="#533">Calibration &amp; batch</text>

    <path d="M220 90 L310 90" stroke="#222" stroke-width="2" marker-end="url(#arrow2)"/>
    <path d="M490 90 L580 90" stroke="#222" stroke-width="2" marker-end="url(#arrow2)"/>

    <defs>
      <marker id="arrow2" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#222" />
      </marker>
    </defs>
  </g>
</svg>
