<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360">
  <rect fill="#f7f7f7" width="800" height="360"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14">
    <rect x="40" y="40" width="220" height="80" rx="6" fill="#ffffff" stroke="#333"/>
    <text x="150" y="72" text-anchor="middle" fill="#111">Browser (WASM)</text>
    <text x="150" y="92" text-anchor="middle" fill="#444">Interactive pricing, Greeks</text>

    <rect x="290" y="40" width="220" height="80" rx="6" fill="#ffffff" stroke="#333"/>
    <text x="400" y="72" text-anchor="middle" fill="#111">Network / Edge</text>
    <text x="400" y="92" text-anchor="middle" fill="#444">gRPC gateway / Proxy</text>

    <rect x="540" y="40" width="220" height="80" rx="6" fill="#ffffff" stroke="#333"/>
    <text x="650" y="72" text-anchor="middle" fill="#111">Backend (gRPC)</text>
    <text x="650" y="92" text-anchor="middle" fill="#444">Calibration, batch risk</text>

    <path d="M260 80 L290 80" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M510 80 L540 80" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#222" />
      </marker>
    </defs>

    <g transform="translate(80,160)">
      <rect x="0" y="0" width="640" height="120" rx="6" fill="#fff" stroke="#666"/>
      <text x="320" y="24" text-anchor="middle" fill="#111" font-weight="700">Shared C++17 Math Library</text>
      <text x="320" y="52" text-anchor="middle" fill="#444">Options, Monte Carlo, SABR, utilities</text>
    </g>

  </g>
</svg>
